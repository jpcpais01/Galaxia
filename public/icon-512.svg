<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- background -->
  <rect width="192" height="192" fill="#00000f"/>

  <!-- background pixel stars -->
  <rect x="30"  y="25"  width="4" height="4" fill="#ffffff" opacity="0.80"/>
  <rect x="150" y="27"  width="4" height="4" fill="#ffffff" opacity="0.55"/>
  <rect x="23"  y="143" width="2" height="2" fill="#8888ff" opacity="0.90"/>
  <rect x="162" y="154" width="4" height="4" fill="#ffffff" opacity="0.42"/>
  <rect x="118" y="15"  width="2" height="2" fill="#ff8844" opacity="0.85"/>
  <rect x="52"  y="168" width="2" height="2" fill="#ffffff" opacity="0.65"/>
  <rect x="173" y="85"  width="2" height="2" fill="#c8dcff" opacity="0.55"/>

  <!-- outer orbit ring -->
  <circle cx="96" cy="96" r="78" fill="none" stroke="#00ffff" stroke-width="1.2" opacity="0.22"/>

  <!-- inner orbit ring -->
  <circle cx="96" cy="96" r="48" fill="none" stroke="#00ffff" stroke-width="1.2" opacity="0.40"/>

  <!-- star glow (soft radial) -->
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#ff6e00" stop-opacity="0.38"/>
    <stop offset="100%" stop-color="#ff6e00" stop-opacity="0"/>
  </radialGradient>
  <circle cx="96" cy="96" r="36" fill="url(#glow)"/>

  <!-- cross flares -->
  <defs>
    <linearGradient id="hflare" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffe066" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#ffe066" stop-opacity="0.85"/>
      <stop offset="50%"  stop-color="#ffe066" stop-opacity="1"/>
      <stop offset="60%"  stop-color="#ffe066" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffe066" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vflare" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffe066" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#ffe066" stop-opacity="0.85"/>
      <stop offset="50%"  stop-color="#ffe066" stop-opacity="1"/>
      <stop offset="60%"  stop-color="#ffe066" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffe066" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="36" y="90" width="120" height="12" fill="url(#hflare)"/>
  <rect x="90" y="36" width="12" height="120" fill="url(#vflare)"/>

  <!-- star body (gold square) -->
  <rect x="80" y="80" width="32" height="32" fill="#ffe066"/>

  <!-- star core (white) -->
  <rect x="87" y="87" width="18" height="18" fill="#ffffff"/>

  <!-- planet 1 — blue, top of outer ring -->
  <circle cx="96" cy="18" r="9" fill="#4488ff"/>

  <!-- planet 2 — teal, right of inner ring -->
  <circle cx="144" cy="96" r="7" fill="#44DDa0"/>
</svg>
